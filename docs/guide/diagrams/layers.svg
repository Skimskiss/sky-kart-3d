<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>

  <!-- layer 1: screens -->
  <rect x="10" y="10" width="560" height="92" rx="10" fill="#e8f1fd" stroke="#2f7de1" stroke-width="2"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#14193d">1. Screens (React, plain HTML)</text>
  <text x="24" y="56" font-size="12" fill="#1b1f3b">main.jsx · App.jsx · ui/Menu · ui/MapScreen · ui/Garage · ui/GaragePreview</text>
  <text x="24" y="74" font-size="12" fill="#1b1f3b">ui/Missions · ui/SettingsScreen · ui/Pause · ui/Results · ui/Shell · styles.css</text>
  <text x="24" y="92" font-size="11" fill="#475569" font-style="italic">What the player sees and taps. Reads the store; never runs the race itself.</text>

  <!-- layer 2: state -->
  <rect x="10" y="122" width="560" height="74" rx="10" fill="#fff3cf" stroke="#d99a00" stroke-width="2"/>
  <text x="24" y="146" font-size="15" font-weight="700" fill="#14193d">2. State and saving</text>
  <text x="24" y="168" font-size="12" fill="#1b1f3b">store.js (Zustand: which screen, the save, pause)  →  game/save.js (localStorage)</text>
  <text x="24" y="186" font-size="11" fill="#475569" font-style="italic">Every reward or purchase is written to the browser at once.</text>

  <!-- layer 3: race scene -->
  <rect x="10" y="216" width="560" height="92" rx="10" fill="#e3f6ea" stroke="#22a35a" stroke-width="2"/>
  <text x="24" y="240" font-size="15" font-weight="700" fill="#14193d">3. Race scene (React Three Fiber + three.js)</text>
  <text x="24" y="262" font-size="12" fill="#1b1f3b">Race.jsx (canvas + game loop) · Hud.jsx · Touch.jsx</text>
  <text x="24" y="280" font-size="12" fill="#1b1f3b">game/visuals.js · game/world3d.js · game/props.js · game/kartModel.js · game/geo.js</text>
  <text x="24" y="298" font-size="11" fill="#475569" font-style="italic">Draws the world. Only reads the simulation; never changes the rules.</text>

  <!-- layer 4: simulation -->
  <rect x="10" y="328" width="560" height="92" rx="10" fill="#f1e8fd" stroke="#7c3aed" stroke-width="2"/>
  <text x="24" y="352" font-size="15" font-weight="700" fill="#14193d">4. Simulation (pure JavaScript, also runs in Node)</text>
  <text x="24" y="374" font-size="12" fill="#1b1f3b">game/sim.js (60 steps a second) · game/ai.js · game/setup.js</text>
  <text x="24" y="392" font-size="12" fill="#1b1f3b">game/trackBuild.js (curve → road, locate) · game/autoplace.js</text>
  <text x="24" y="410" font-size="11" fill="#475569" font-style="italic">Karts, laps, checkpoints, ramps, boosts, positions. No drawing, no React.</text>

  <!-- layer 5: data -->
  <rect x="10" y="440" width="560" height="110" rx="10" fill="#fde8ec" stroke="#e11d48" stroke-width="2"/>
  <text x="24" y="464" font-size="15" font-weight="700" fill="#14193d">5. Data and rules (pure JavaScript)</text>
  <text x="24" y="486" font-size="12" fill="#1b1f3b">game/tracks.js (12 tracks) · game/karts.js (karts, paints, upgrades, rivals)</text>
  <text x="24" y="504" font-size="12" fill="#1b1f3b">game/progress.js (rewards, stars, missions, shop) · game/biomes.js</text>
  <text x="24" y="526" font-size="11" fill="#475569" font-style="italic">Plain lists and small functions. Changing a number here changes the game.</text>
  <text x="24" y="542" font-size="11" fill="#475569" font-style="italic">The Node tests in scripts/ check layers 4 and 5 without a browser.</text>

  <!-- helpers column -->
  <rect x="592" y="10" width="158" height="540" rx="10" fill="#f4f6fb" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="606" y="34" font-size="15" font-weight="700" fill="#14193d">Helpers used</text>
  <text x="606" y="52" font-size="15" font-weight="700" fill="#14193d">by many layers</text>
  <text x="606" y="88" font-size="13" font-weight="700" fill="#1d4f9c">game/input.js</text>
  <text x="606" y="106" font-size="11" fill="#475569">keyboard, gamepad and</text>
  <text x="606" y="120" font-size="11" fill="#475569">touch → one input object</text>
  <text x="606" y="160" font-size="13" font-weight="700" fill="#1d4f9c">game/audio.js</text>
  <text x="606" y="178" font-size="11" fill="#475569">sounds and music made</text>
  <text x="606" y="192" font-size="11" fill="#475569">in code, played by Howler</text>
  <text x="606" y="232" font-size="13" font-weight="700" fill="#1d4f9c">game/bus.js</text>
  <text x="606" y="250" font-size="11" fill="#475569">small shared object: the</text>
  <text x="606" y="264" font-size="11" fill="#475569">HUD reads race numbers</text>
  <text x="606" y="278" font-size="11" fill="#475569">from it 10 times a second</text>

  <!-- arrows: each layer uses the one below -->
  <line x1="290" y1="102" x2="290" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="290" y1="196" x2="290" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="290" y1="308" x2="290" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="290" y1="420" x2="290" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="606" y="330" font-size="11" fill="#475569">Arrows: a layer uses</text>
  <text x="606" y="344" font-size="11" fill="#475569">the layers below it,</text>
  <text x="606" y="358" font-size="11" fill="#475569">never the ones above.</text>
</svg>
