<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>

  <!-- boxes -->
  <g font-size="14" font-weight="700" fill="#14193d" text-anchor="middle">
    <rect x="10" y="20" width="110" height="52" rx="10" fill="#e8f1fd" stroke="#2f7de1" stroke-width="2"/>
    <text x="65" y="43">Garage</text><text x="65" y="60" font-size="10" font-weight="400">ui/Garage.jsx</text>
    <rect x="130" y="20" width="110" height="52" rx="10" fill="#e8f1fd" stroke="#2f7de1" stroke-width="2"/>
    <text x="185" y="43">Missions</text><text x="185" y="60" font-size="10" font-weight="400">ui/Missions.jsx</text>
    <rect x="250" y="20" width="120" height="52" rx="10" fill="#e8f1fd" stroke="#2f7de1" stroke-width="2"/>
    <text x="310" y="43">Settings</text><text x="310" y="60" font-size="10" font-weight="400">ui/SettingsScreen.jsx</text>

    <rect x="450" y="20" width="130" height="58" rx="10" fill="#f4f6fb" stroke="#475569" stroke-width="2"/>
    <text x="515" y="45">Pause menu</text><text x="515" y="63" font-size="10" font-weight="400">ui/Pause.jsx</text>

    <rect x="10" y="170" width="130" height="60" rx="10" fill="#ffb703" stroke="#b07d00" stroke-width="2"/>
    <text x="75" y="196">Main menu</text><text x="75" y="214" font-size="10" font-weight="400">ui/Menu.jsx</text>
    <rect x="230" y="170" width="130" height="60" rx="10" fill="#e8f1fd" stroke="#2f7de1" stroke-width="2"/>
    <text x="295" y="196">World map</text><text x="295" y="214" font-size="10" font-weight="400">ui/MapScreen.jsx</text>
    <rect x="450" y="170" width="130" height="60" rx="10" fill="#e3f6ea" stroke="#22a35a" stroke-width="2"/>
    <text x="515" y="196">Race</text><text x="515" y="214" font-size="10" font-weight="400">Race.jsx + Hud + Touch</text>
    <rect x="670" y="170" width="120" height="60" rx="10" fill="#e8f1fd" stroke="#2f7de1" stroke-width="2"/>
    <text x="730" y="196">Results</text><text x="730" y="214" font-size="10" font-weight="400">ui/Results.jsx</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a2)">
    <!-- main row -->
    <line x1="140" y1="200" x2="227" y2="200"/>
    <line x1="360" y1="200" x2="447" y2="200"/>
    <line x1="580" y1="200" x2="667" y2="200"/>
    <!-- menu to the side screens -->
    <line x1="50" y1="170" x2="50" y2="75"/>
    <line x1="85" y1="170" x2="170" y2="75"/>
    <line x1="115" y1="170" x2="290" y2="75"/>
    <!-- race <-> pause -->
    <line x1="500" y1="170" x2="500" y2="81"/>
    <line x1="530" y1="78" x2="530" y2="167"/>
    <!-- pause -> map -->
    <path d="M450 60 C 400 70, 340 110, 320 167"/>
    <!-- results -> race (next / replay) -->
    <path d="M700 230 C 690 285, 560 285, 545 233"/>
    <!-- results -> map -->
    <path d="M760 230 L 760 320 L 295 320 L 295 233"/>
  </g>

  <!-- labels -->
  <g font-size="11" fill="#1b1f3b">
    <text x="146" y="192">Start / Continue</text>
    <text x="370" y="192">START RACE</text>
    <text x="592" y="192">race ends</text>
    <text x="545" y="104">up: pause (Esc, P, the pause</text>
    <text x="545" y="118">button, or the window loses focus)</text>
    <text x="545" y="140">down: Resume or Restart race</text>
    <text x="318" y="140" text-anchor="end">Quit to map</text>
    <text x="590" y="40">Settings opens the</text>
    <text x="590" y="54">settings panel on top</text>
    <text x="568" y="300">NEXT TRACK, REPLAY</text>
    <text x="500" y="313">MAP</text>
  </g>
  <text x="10" y="365" font-size="11" fill="#475569" font-style="italic">The map, garage, missions and settings screens also share a bottom bar to jump between them. store.js holds the current screen.</text>
</svg>
